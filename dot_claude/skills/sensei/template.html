<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{題名}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --fg: #111; --line: #999; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #eee; --line: #666; }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "LINE Seed JP", sans-serif;
    font-size: 17px;
    line-height: 1.9;
  }
  .page { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }

  nav {
    position: sticky; top: 0; align-self: start;
    height: 100vh; overflow: auto;
    padding: 48px 24px;
    border-right: 1px solid var(--line);
  }
  nav p { margin: 0 0 16px; font-weight: 700; }
  nav ol { list-style: none; margin: 0; padding: 0; }
  nav a { display: block; padding: 6px 0; color: inherit; text-decoration: none; line-height: 1.5; }
  nav a:hover { text-decoration: underline; }

  main { padding: 48px clamp(24px, 4vw, 72px) 120px; }
  header h1 { margin: 0; font-size: clamp(28px, 2.6vw, 44px); line-height: 1.4; }
  header .date { margin: 8px 0 0; }

  section { margin-top: 72px; padding-top: 24px; border-top: 1px solid var(--fg); scroll-margin-top: 24px; }
  h2 { margin: 0 0 24px; font-size: 1.6em; line-height: 1.4; }
  h3 { margin: 32px 0 8px; font-size: 1em; }
  p { margin: 12px 0; max-width: 40em; }
  .lead { font-size: 1.25em; max-width: 44em; }

  .pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(32px, 4vw, 80px); align-items: start; }
  .pair > div > :first-child { margin-top: 0; }

  ol, ul { margin: 12px 0; padding-left: 1.5em; max-width: 40em; }
  li { margin: 8px 0; }

  table { width: 100%; border-collapse: collapse; margin: 0 0 16px; }
  th, td { border: 1px solid var(--line); padding: 10px 14px; text-align: left; vertical-align: top; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: 0.88em; }

  figure { margin: 0 0 32px; }
  figcaption { margin-bottom: 8px; font-weight: 700; }
  svg { display: block; width: 100%; height: auto; color: var(--fg); }
  svg text { font-family: "LINE Seed JP", sans-serif; fill: currentColor; }
  .box { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .label-bg { fill: var(--bg); }

  @media (max-width: 1000px) {
    .page { grid-template-columns: 1fr; }
    nav { position: static; height: auto; padding: 24px; border-right: 0; border-bottom: 1px solid var(--line); }
    .pair { grid-template-columns: 1fr; }
  }
  @media print {
    nav { display: none; }
    .page { display: block; }
  }
</style>
</head>
<body>
<div class="page">

<nav>
  <p>目次</p>
  <ol>
    <li><a href="#conclusion">先に結論</a></li>
    <li><a href="#cast">1. 登場人物</a></li>
    <!-- 以降、section の id と見出しを 1 対 1 で並べる -->
  </ol>
</nav>

<main>

<header>
  <h1>{{題名}}</h1>
  <p class="date">{{YYYY-MM-DD}}</p>
</header>

<section id="conclusion">
  <h2>先に結論</h2>
  <p class="lead">{{3 文以内。たとえの語を使い、用語はかっこで添える}}</p>
</section>

<section id="cast">
  <h2>1. 登場人物</h2>
  <table>
    <tr><th>名前</th><th>役割</th><th>たとえ</th></tr>
    <tr><td>{{名前}}</td><td>{{役割を 1 文で}}</td><td>{{たとえ}}</td></tr>
  </table>
</section>

<!-- 部品 1: 文章と図表を左右に並べる節。これを基本形にする -->
<section id="{{id}}">
  <h2>{{番号}}. {{見出し}}</h2>
  <div class="pair">
    <div>
      <p>{{説明}}</p>
    </div>
    <figure>
      <figcaption>{{図表の題}}</figcaption>
      <!-- table、ol、svg のいずれかを置く -->
    </figure>
  </div>
</section>

</main>
</div>
</body>
