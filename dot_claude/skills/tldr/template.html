<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tldr {{日付}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fff; --fg: #111; --line: #999; --mute: #666; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --fg: #eee; --line: #666; --mute: #999; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: "LINE Seed JP", sans-serif;
    font-size: 17px;
    line-height: 1.9;
  }
  main { max-width: 44em; margin: 0 auto; padding: 48px 24px 120px; }
  article + article { margin-top: 72px; padding-top: 48px; border-top: 1px solid var(--fg); }
  h1 { margin: 0 0 32px; font-size: 1.6em; line-height: 1.4; }
  h2 { margin: 40px 0 8px; font-size: 1em; color: var(--mute); }
  p { margin: 8px 0; }
  ol, ul { margin: 8px 0; padding-left: 1.5em; }
  li { margin: 6px 0; }
  .reply { position: relative; margin: 8px 0 16px; padding: 14px 88px 14px 16px; border: 1px solid var(--line); white-space: pre-wrap; }
  .reply button {
    position: absolute; top: 8px; right: 8px;
    font: inherit; font-size: 0.8em; line-height: 1;
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px;
    background: var(--bg); color: var(--fg); cursor: pointer;
  }
  .source { color: var(--mute); }
  .source a { color: inherit; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>

<!-- ソースごとに <article> を 1 つ。複数ソースは縦に並べる -->
<article>
<h1>{{題名}}</h1>

<h2>概要</h2>
<p>{{何の話で、自分に何を求めているか。2 文以内}}</p>

<h2>要対応</h2>
<ol>
  <li>{{やること 1。期限があれば行末}}</li>
</ol>
<!-- 要対応が無ければ <ol> の代わりに <p>なし</p> -->

<h2>返信案</h2>
<!-- 要対応の件数ぶん .reply を繰り返す。要対応が なし なら節ごと省く -->
<div class="reply"><button type="button">コピー</button>{{返信文。1 件 3 文以内}}</div>

<h2>事実</h2>
<ul>
  <li>{{日付、数値、固有名、決定事項。6 件以内}}</li>
</ul>

<h2>出典</h2>
<p class="source">{{発言者}}、{{投稿日時}}。{{読み込んだ範囲}}<br><a href="{{URL}}">{{URL}}</a></p>
</article>

</main>
<script>
  document.querySelectorAll(".reply button").forEach(function (button) {
    button.addEventListener("click", function () {
      var text = button.parentElement.textContent.replace(button.textContent, "").trim();
      navigator.clipboard.writeText(text).then(function () {
        button.textContent = "コピー済";
        setTimeout(function () { button.textContent = "コピー"; }, 1500);
      });
    });
  });
</script>
</body>
</html>
