onboarding = false
[keys]
prefix = "ctrl+a"

focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]

goto = ["prefix+g", "ctrl+alt+g"]
new_tab = ["prefix+c", "ctrl+alt+c"]
split_vertical = ["prefix+v", "ctrl+alt+d"]
zoom = ["prefix+z", "ctrl+alt+z"]
last_pane = "prefix+tab"
switch_workspace = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "run lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open scratch terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+d"
type = "shell"
command = "herdr plugin action invoke open-hunk-picker --plugin herdr-hunk"
description = "open hunk diff picker"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "herdr plugin action invoke toggle-autodiff --plugin herdr-hunk"
description = "toggle hunk autodiff"

[theme]
name = "terminal"

auto_switch = false
[ui]
sidebar_width = 30
sidebar_min_width = 30
sidebar_max_width = 30
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
mouse_capture = true

[ui.toast]
delivery = "terminal"
delay_seconds = 1
